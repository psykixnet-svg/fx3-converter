 DESIGN MEMO — 通貨コンバーター (FX)
 目的   : 海外出張で「現地通貨 ⇄ 円 ⇄ 同行者の通貨」を一度の入力で同時表示
 デザイン: 案 3a "Ledger × Lime"
          紙の台帳レイアウト（罫線 + 右寄せタブular数字）に
          基準行のライム塗り。配色 paper #EDEEE9 / ink #1F2233 /
          line #D3D5CE / mute #565B69 / lime #C6F24E / warn #B0382E
 書体   : 端末フォールバックのみ（CDN不使用）
          見出し=明朝系 / UI=システムsans / 数値=等幅
 行数   : JPY 含めて 2〜5 行可変。JPY は常に先頭固定・ライム表示。
          行数に応じ <main data-n> で数値サイズと余白を自動縮小
 構成   : [見出し + 取込スタンプ] → [JPY] → [外貨1..4] → [＋追加] → [UPDATE]
 入力   : ソフトキーボード (inputmode=decimal) のみ。どの行に入力しても他行が連動
 保存   : localStorage "fx3" { rates(1円あたり), fetchedAt, src, srcTime, cs[], last{c,v} }
          旧形式 (c1/c2, last.i) は起動時に移行
 レート : open.er-api.com → fawazahmed0 currency-api (jsDelivr / pages.dev) の順に試行
 オフライン: sw.js があれば登録（HTTPS配信時）。無くても単体で動作
==================================================================
-->
<style>
:root{
  --paper:#EDEEE9; --ink:#1F2233; --line:#D3D5CE; --rule:#C4C7C0;
  --mute:#565B69; --lime:#C6F24E; --warn:#B0382E;
  --ui:-apple-system,system-ui,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
  --num:ui-monospace,"SF Mono",Menlo,monospace;
  --fs:clamp(34px,11vw,46px); --pad:14px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:var(--ui)}
body{
  min-height:100dvh;display:flex;flex-direction:column;
  padding:max(6px,env(safe-area-inset-top)) max(0px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(0px,env(safe-area-inset-left));
}

header{
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  padding:20px 22px 12px;border-bottom:1px solid var(--ink);
}
h1{font:400 27px/1 var(--serif);letter-spacing:.02em;font-weight:400}
.stamp{text-align:right;min-width:0}
.stamp .when{font:500 11px/1.4 var(--num);letter-spacing:.02em;white-space:nowrap}
.stamp .note{font:400 10px/1.4 var(--ui);color:var(--mute);margin-top:2px;white-space:nowrap}
.stamp.stale .when{color:var(--warn)}

main{flex:1}
main[data-n="2"]{--fs:clamp(40px,13vw,56px);--pad:18px}
main[data-n="3"]{--fs:clamp(34px,11vw,46px);--pad:14px}
main[data-n="4"]{--fs:clamp(29px,9.5vw,38px);--pad:9px}
main[data-n="5"]{--fs:clamp(25px,8vw,30px);--pad:6px}
main[data-n="4"] .sub,main[data-n="5"] .sub{font-size:10px}
main[data-n="4"] .meta,main[data-n="5"] .meta{margin-top:2px;min-height:0}
main[data-n="5"] .cur .name{font-size:10px;margin-top:2px}
main[data-n="5"] .del{padding:3px 9px;font-size:10px}
/* 5行時は下部を詰めてキーボード展開時の可視領域(約508px)に収める */
body[data-n="5"] footer{padding:8px 22px 14px}
body[data-n="5"] #refresh{padding:10px 14px}
body[data-n="4"] #add,body[data-n="5"] #add{margin:10px 22px;padding:11px}
body[data-n="5"] .hint{display:none}

.row{
  display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:baseline;
  padding:var(--pad) 22px calc(var(--pad) - 3px);border-bottom:1px solid var(--line);
}
.row.base{background:rgba(198,242,78,.16)}
.row.jpy.base{background:var(--lime)}
.cur{position:relative;min-width:76px;display:block}
.cur .top{display:flex;align-items:center;gap:7px}
.cur .flag{font-size:17px;line-height:1}
.cur .code{font:500 15px/1.2 var(--num);letter-spacing:.06em}
.cur .name{font:400 10.5px/1.3 var(--ui);color:var(--mute);margin-top:3px;white-space:nowrap}
.row.jpy.base .cur .name,.row.jpy.base .sub{color:var(--ink)}
.cur select{position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);opacity:0;font-size:16px}
.amt{
  width:100%;min-width:0;text-align:right;border:0;background:transparent;outline:0;
  font-family:var(--num);font-weight:400;font-size:var(--fs);line-height:1.1;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;caret-color:var(--ink);
}
.amt::placeholder{color:#B9BCC4}
.meta{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:5px;min-height:15px}
.del{
  position:relative;font:400 10.5px/1 var(--ui);color:var(--mute);background:transparent;
  border:1px solid var(--rule);border-radius:20px;padding:5px 10px;min-height:26px;
}
.del::before{content:"";position:absolute;inset:-9px -14px} /* 見た目は小さく、当たり判定は44px以上 */
.del[hidden]{display:none}
.sub{flex:1;text-align:right;font:400 11px/1.3 var(--num);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#add{
  display:block;width:calc(100% - 44px);margin:16px 22px;padding:14px;
  border:1px dashed var(--rule);border-radius:3px;background:transparent;
  font:400 12.5px/1 var(--ui);color:var(--mute);min-height:44px;
}
#add[hidden]{display:none}

.empty{margin:16px 22px;padding:14px;border:1px solid var(--line);border-radius:3px;color:var(--mute);font:400 12px/1.7 var(--ui)}
.empty[hidden]{display:none}

footer{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 22px 20px;border-top:1px solid var(--ink);
}
footer .hint{font:400 10.5px/1.4 var(--ui);color:var(--mute)}
#refresh{
  font:500 11.5px/1 var(--num);letter-spacing:.04em;color:var(--ink);background:var(--lime);
  border:0;border-radius:3px;padding:13px 16px;min-height:44px;
}
#refresh:active{filter:brightness(.94)}
#refresh[disabled]{background:#E4EAC9;color:var(--mute)}
#refresh:focus-visible,.del:focus-visible,#add:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

#sheet{position:fixed;inset:0;background:rgba(31,34,51,.42);display:none;align-items:flex-end}
#sheet.show{display:flex}
#sheet .panel{width:100%;max-height:76%;background:var(--paper);border-top:1px solid var(--ink);display:flex;flex-direction:column}
#sheet .head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 10px;border-bottom:1px solid var(--line)}
#sheet .head h2{font:400 19px/1 var(--serif);font-weight:400}
#sheet .close{font:400 12px var(--ui);color:var(--mute);background:transparent;border:0;padding:10px;min-height:44px}
#list{overflow:auto;-webkit-overflow-scrolling:touch}
#list button{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px 22px;
  background:transparent;border:0;border-bottom:1px solid #E3E4DE;text-align:left;min-height:48px;
}
#list button[aria-current="true"]{background:rgba(198,242,78,.35)}
#list .f{font-size:16px;line-height:1}
#list .c{font:500 13px var(--num);letter-spacing:.06em;min-width:44px}
#list .n{font:400 12px var(--ui);color:var(--mute)}
#list .r{flex:1;text-align:right;font:400 11px var(--num);color:var(--mute)}

#toast{
  position:fixed;left:18px;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);border-radius:4px;padding:11px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .18s,transform .18s;
}
#toast.show{opacity:1;transform:translateY(0);pointer-events:auto}
#toast .msg{font:400 12px var(--ui)}
#toast button{font:500 12px var(--num);color:var(--lime);background:transparent;border:0;padding:6px 2px;min-height:32px}
#toast button[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<header>
  <h1>通貨</h1>
  <div class="stamp" id="stamp">
    <div class="when" id="when">レート未取得</div>
    <div class="note" id="note">ネット接続中に UPDATE を押してください</div>
  </div>
</header>

<main id="rows" data-n="3"></main>

<button id="add" type="button">＋ 通貨を追加</button>

<p class="empty" id="empty">まだレートがありません。ネットに繋がっている間に UPDATE を押すと、そのレートが端末に保存され、以後はオフラインで計算できます。</p>

<footer>
  <span class="hint" id="hint">保存済みレートで計算</span>
  <button id="refresh" type="button">UPDATE</button>
</footer>

<div id="sheet" role="dialog" aria-modal="true" aria-label="通貨を選ぶ">
  <div class="panel">
    <div class="head"><h2>通貨を選ぶ</h2><button class="close" id="sheetClose" type="button">閉じる</button></div>
    <div id="list"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"><span class="msg" id="toastMsg"></span><button id="toastAct" type="button" hidden>取り消す</button></div>

<script>
(() => {
"use strict";

/* ---------- 通貨マスタ ---------- */
const CUR = [
  ["JPY","🇯🇵","日本円",0],
  ["PHP","🇵🇭","フィリピン・ペソ",2],
  ["AUD","🇦🇺","オーストラリア・ドル",2],
  ["USD","🇺🇸","米ドル",2],
  ["EUR","🇪🇺","ユーロ",2],
  ["GBP","🇬🇧","英ポンド",2],
  ["NZD","🇳🇿","NZドル",2],
  ["CAD","🇨🇦","カナダ・ドル",2],
  ["CHF","🇨🇭","スイス・フラン",2],
  ["CNY","🇨🇳","人民元",2],
  ["HKD","🇭🇰","香港ドル",2],
  ["TWD","🇹🇼","台湾ドル",1],
  ["KRW","🇰🇷","韓国ウォン",0],
  ["SGD","🇸🇬","シンガポール・ドル",2],
  ["THB","🇹🇭","タイ・バーツ",2],
  ["MYR","🇲🇾","マレーシア・リンギット",2],
  ["IDR","🇮🇩","インドネシア・ルピア",0],
  ["VND","🇻🇳","ベトナム・ドン",0],
  ["INR","🇮🇳","インド・ルピー",2],
  ["AED","🇦🇪","UAEディルハム",2],
  ["SAR","🇸🇦","サウジ・リヤル",2],
  ["BRL","🇧🇷","ブラジル・レアル",2],
  ["MXN","🇲🇽","メキシコ・ペソ",2],
  ["SEK","🇸🇪","スウェーデン・クローナ",2],
  ["PLN","🇵🇱","ポーランド・ズウォティ",2],
  ["TRY","🇹🇷","トルコ・リラ",2],
];
const INFO = Object.fromEntries(CUR.map(([c,f,n,d]) => [c,{c,f,n,d}]));
const MAX = 5; // JPY + 外貨4

/* ---------- 保存（旧形式からの移行つき） ---------- */
const KEY = "fx3";
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
if (!Array.isArray(S.cs)) {                       // 旧: c1 / c2
  const a = INFO[S.c1] ? S.c1 : "PHP", b = INFO[S.c2] ? S.c2 : "AUD";
  S.cs = a === b ? [a] : [a, b];
}
delete S.c1; delete S.c2;
S.cs = S.cs.filter((c, i, arr) => INFO[c] && c !== "JPY" && arr.indexOf(c) === i).slice(0, MAX - 1);
if (!S.cs.length) S.cs = ["PHP"];
if (!S.last || typeof S.last.c !== "string") {    // 旧: last.i（行番号）
  const i = S.last && typeof S.last.i === "number" ? S.last.i : 0;
  S.last = { c: (["JPY"].concat(S.cs))[i] || "JPY", v: (S.last && S.last.v) || "" };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const codes = () => ["JPY"].concat(S.cs);
const rateOf = c => c === "JPY" ? 1 : (S.rates && S.rates[c]) || null; // 1円あたりの外貨

/* ---------- 数値整形 ---------- */
const parse = s => {
  const t = String(s == null ? "" : s).replace(/[,\s]/g, "")
    .replace(/[０-９．]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  if (t === "" || t === ".") return NaN;
  return Number(t);
};
const fmt = (n, c) => isFinite(n)
  ? new Intl.NumberFormat("en-US", { maximumFractionDigits: INFO[c].d }).format(n) : "";
const fmtRate = n => new Intl.NumberFormat("en-US", { maximumSignificantDigits: 4 }).format(n);

/* ---------- 行の生成 ---------- */
const rowsEl = document.getElementById("rows");
const addBtn = document.getElementById("add");
let rows = [];

function renderRows() {
  const cs = codes();
  rowsEl.innerHTML = "";
  rowsEl.dataset.n = document.body.dataset.n = String(cs.length);
  rows = cs.map((c, i) => {
    const m = INFO[c], jpy = i === 0;
    const r = document.createElement("section");
    r.className = "row" + (jpy ? " jpy" : "");
    r.innerHTML =
      '<label class="cur">' +
        '<span class="top"><span class="flag"></span><span class="code"></span></span>' +
        '<span class="name"></span>' +
        (jpy ? "" : '<select aria-label="通貨を選択"></select>') +
      "</label>" +
      '<input class="amt" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="0" aria-label="金額">' +
      '<div class="meta">' +
        (jpy ? "" : '<button class="del" type="button">× 外す</button>') +
        '<div class="sub"></div>' +
      "</div>";
    rowsEl.appendChild(r);

    const o = {
      code: c, el: r,
      inp: r.querySelector(".amt"), sub: r.querySelector(".sub"),
      del: r.querySelector(".del"), sel: r.querySelector("select")
    };
    r.querySelector(".flag").textContent = m.f;
    r.querySelector(".code").textContent = c;
    r.querySelector(".name").textContent = m.n;

    if (o.sel) {
      o.sel.innerHTML = CUR.filter(x => x[0] !== "JPY")
        .map(([cc, f, n]) => '<option value="' + cc + '">' + f + " " + cc + " " + n + "</option>").join("");
      o.sel.value = c;
      o.sel.addEventListener("change", () => changeCurrency(i - 1, o.sel.value));
    }
    if (o.del) {
      o.del.hidden = cs.length <= 2;
      o.del.addEventListener("click", e => { e.preventDefault(); removeCurrency(i - 1); });
    }
    r.addEventListener("click", e => {
      if (!e.target.closest("select,.del") && e.target !== o.inp) o.inp.focus();
    });
    o.inp.addEventListener("focus", () => {
      rows.forEach(x => x.el.classList.remove("base"));
      r.classList.add("base");
      o.inp.value = o.inp.value.replace(/,/g, "");
      S.last = { c: c, v: o.inp.value };
      fit(o.inp);
      setTimeout(() => { try { o.inp.setSelectionRange(0, o.inp.value.length); } catch (e) {} }, 0);
    });
    o.inp.addEventListener("input", () => {
      const v = o.inp.value.replace(/[^\d.,０-９．]/g, "");
      if (v !== o.inp.value) o.inp.value = v;
      S.last = { c: c, v: o.inp.value };
      recalc(); save();
    });
    o.inp.addEventListener("blur", () => {
      const n = parse(o.inp.value);
      o.inp.value = isFinite(n) ? fmt(n, c) : "";
      fit(o.inp);
    });
    return o;
  });
  addBtn.hidden = cs.length >= MAX;
  markBase();
  recalc();
}

function markBase() {
  rows.forEach(o => o.el.classList.toggle("base", o.code === S.last.c));
}

function fit(inp) {
  const len = inp.value.length;
  inp.style.fontSize = len > 8 ? "max(20px, calc(var(--fs) * " + (8 / len).toFixed(3) + "))" : "";
}

function renderSubs() {
  rows.forEach(o => {
    if (o.code === "JPY") { o.sub.textContent = stampLine(); return; }
    const r = rateOf(o.code);
    o.sub.textContent = r ? "1 " + o.code + " = " + fmtRate(1 / r) + " 円"
                          : (S.rates ? o.code + " のレートなし" : "");
  });
}

function recalc() {
  const base = INFO[S.last.c] ? S.last.c : "JPY";
  const n = parse(S.last.v), src = rateOf(base);
  rows.forEach(o => {
    if (o.code === base) {
      if (document.activeElement !== o.inp) o.inp.value = isFinite(n) ? fmt(n, o.code) : (S.last.v || "");
    } else {
      const dst = rateOf(o.code);
      o.inp.value = (isFinite(n) && src && dst) ? fmt(n / src * dst, o.code) : "";
    }
    fit(o.inp);
  });
  renderSubs();
}

/* ---------- 通貨の変更・追加・削除 ---------- */
function changeCurrency(idx, c) {
  const j = S.cs.indexOf(c);
  if (j > -1 && j !== idx) S.cs[j] = S.cs[idx];  // 重複したら入れ替え
  const old = S.cs[idx];
  S.cs[idx] = c;
  if (S.last.c === old) S.last.c = c;
  save(); renderRows();
}

let undo = null;
function removeCurrency(idx) {
  if (S.cs.length <= 1) return;
  const code = S.cs[idx];
  if (S.last.c === code) {                        // 表示額を保って基準を JPY へ
    const n = parse(S.last.v), r = rateOf(code);
    S.last = { c: "JPY", v: (isFinite(n) && r) ? fmt(n / r, "JPY") : "" };
  }
  S.cs.splice(idx, 1);
  undo = { idx, code };
  save(); renderRows();
  toast(code + " を削除しました", () => {
    if (!undo || S.cs.length >= MAX - 1) return;
    S.cs.splice(undo.idx, 0, undo.code);
    undo = null; save(); renderRows();
  });
}

/* ---------- 通貨選択シート ---------- */
const sheet = document.getElementById("sheet"), list = document.getElementById("list");
let pick = null; // {mode:"add"|"change", idx}

function openSheet(mode, idx) {
  pick = { mode, idx };
  list.innerHTML = "";
  CUR.filter(x => x[0] !== "JPY").forEach(([c, f, n]) => {
    const b = document.createElement("button");
    b.type = "button";
    if (S.cs.indexOf(c) > -1) b.setAttribute("aria-current", "true");
    const r = rateOf(c);
    b.innerHTML = '<span class="f">' + f + '</span><span class="c">' + c + '</span>' +
      '<span class="n">' + n + '</span><span class="r">' + (r ? "1 = " + fmtRate(1 / r) + " 円" : "—") + "</span>";
    b.addEventListener("click", () => { choose(c); });
    list.appendChild(b);
  });
  sheet.classList.add("show");
}
function closeSheet() { sheet.classList.remove("show"); pick = null; }
function choose(c) {
  if (!pick) return;
  if (pick.mode === "add") {
    if (S.cs.indexOf(c) > -1) { closeSheet(); return; }
    if (S.cs.length >= MAX - 1) { closeSheet(); return; }
    S.cs.push(c); save(); renderRows();
  } else {
    changeCurrency(pick.idx, c);
  }
  closeSheet();
}
document.getElementById("sheetClose").addEventListener("click", closeSheet);
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
addBtn.addEventListener("click", () => openSheet("add"));

/* ---------- 取込スタンプ ---------- */
const pad = n => String(n).padStart(2, "0");
const ymdhm = d => d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
function ageDays() {
  if (!S.fetchedAt) return null;
  return Math.floor((new Date().setHours(0,0,0,0) - new Date(S.fetchedAt).setHours(0,0,0,0)) / 864e5);
}
function stampLine() {
  const d = ageDays();
  if (d === null) return "レート未取得";
  return "レート取込 " + ymdhm(new Date(S.fetchedAt)) + "・" + (d <= 0 ? "今日" : d + "日前");
}
function renderStamp() {
  const st = document.getElementById("stamp");
  const d = ageDays();
  document.getElementById("empty").hidden = !!S.rates;
  if (d === null) {
    st.className = "stamp";
    document.getElementById("when").textContent = "レート未取得";
    document.getElementById("note").textContent = "ネット接続中に UPDATE を押してください";
  } else {
    st.className = "stamp" + (d >= 3 ? " stale" : "");
    document.getElementById("when").textContent = pad(new Date(S.fetchedAt).getMonth() + 1) + "/" + pad(new Date(S.fetchedAt).getDate()) + " " + (d <= 0 ? "今日" : d + "日前");
    document.getElementById("note").textContent = "基準 " + (S.srcTime ? ymdhm(new Date(S.srcTime)) : "—") + "（" + (S.src || "") + "）";
  }
  renderSubs();
}

/* ---------- レート取得 ---------- */
async function getJSON(url, ms = 9000) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { signal: ac.signal, cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
const SOURCES = [
  async () => {
    const j = await getJSON("https://open.er-api.com/v6/latest/JPY");
    if (j.result !== "success" || !j.rates) throw 0;
    return { rates: j.rates, time: j.time_last_update_unix * 1000, src: "open.er-api.com" };
  },
  async () => fromFawaz(await getJSON("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json"), "currency-api"),
  async () => fromFawaz(await getJSON("https://latest.currency-api.pages.dev/v1/currencies/jpy.json"), "currency-api"),
];
function fromFawaz(j, src) {
  if (!j || !j.jpy) throw 0;
  const rates = {};
  for (const k in j.jpy) rates[k.toUpperCase()] = j.jpy[k];
  return { rates, time: j.date ? new Date(j.date + "T00:00:00Z").getTime() : null, src };
}

const btn = document.getElementById("refresh");
btn.addEventListener("click", async () => {
  btn.disabled = true; btn.textContent = "取得中…";
  let got = null;
  for (const f of SOURCES) { try { got = await f(); break; } catch (e) {} }
  btn.disabled = false; btn.textContent = "UPDATE";
  if (!got) {
    toast(S.rates ? "取得できませんでした。保存済みのレートで計算を続けます" : "取得できませんでした。ネット接続を確認してください");
    return;
  }
  const keep = {};
  CUR.forEach(([c]) => { if (c !== "JPY" && got.rates[c]) keep[c] = got.rates[c]; });
  S.rates = keep; S.fetchedAt = Date.now(); S.srcTime = got.time; S.src = got.src;
  save(); renderStamp(); recalc();
  toast("レートを更新しました");
});

/* ---------- トースト（取り消し対応） ---------- */
let tt, act = null;
const toastEl = document.getElementById("toast"), toastMsg = document.getElementById("toastMsg"), toastAct = document.getElementById("toastAct");
function toast(msg, onAct) {
  toastMsg.textContent = msg;
  act = onAct || null;
  toastAct.hidden = !act;
  toastEl.classList.add("show");
  clearTimeout(tt);
  tt = setTimeout(() => { toastEl.classList.remove("show"); act = null; }, act ? 5000 : 2600);
}
toastAct.addEventListener("click", () => {
  if (act) act();
  toastEl.classList.remove("show"); act = null; clearTimeout(tt);
});

/* ---------- 起動 ---------- */
renderRows(); renderStamp();
setInterval(renderStamp, 60000);

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
